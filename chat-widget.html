<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Chat Widget -->
    <div id="chat-widget" class="hidden fixed bottom-6 right-6 z-50">
      <div
        class="chat-widget bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-96"
      >
        <!-- Chat Header -->
        <div
          class="bg-primary text-white p-4 rounded-t-2xl flex justify-between items-center"
        >
          <div class="flex items-center">
            <div
              class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mr-3"
            >
              <i class="fas fa-headset"></i>
            </div>
            <div>
              <h4 class="font-bold">AutoElite Support</h4>
              <p class="text-sm opacity-90">Typically replies in 5 minutes</p>
            </div>
          </div>
          <button onclick="closeChat()" class="text-white hover:text-gray-200">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <!-- Chat Messages -->
        <div
          id="chat-messages"
          class="p-4 h-96 overflow-y-auto custom-scrollbar"
        >
          <div class="flex justify-start mb-4">
            <div class="bg-gray-200 dark:bg-gray-700 p-3 rounded-xl max-w-xs">
              <span class="font-bold text-primary">AutoElite Support:</span> Hi
              there! 👋 How can I help you today?
            </div>
          </div>
          <div class="flex justify-start mb-4">
            <div class="bg-gray-200 dark:bg-gray-700 p-3 rounded-xl max-w-xs">
              We're here to assist with car rentals, servicing, or any questions
              you might have!
            </div>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
          <div class="flex space-x-2">
            <input
              type="text"
              id="chat-input"
              placeholder="Type your message..."
              class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-xl bg-light dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-primary"
              onkeypress="if(event.key === 'Enter') sendChatMessage()"
            />
            <button
              onclick="sendChatMessage()"
              class="btn-primary px-6 rounded-xl"
            >
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
