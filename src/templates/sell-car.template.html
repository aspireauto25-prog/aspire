<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Car Selling Inquiry</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f7;
      font-family: Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f7; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <!-- Container -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: #ff1616;
                  color: #ffffff;
                  padding: 20px;
                  text-align: center;
                "
              >
                <h2 style="margin: 0">New Car Selling Request</h2>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 20px; color: #333333">
                <p style="margin-bottom: 20px">
                  A user has submitted a request to sell their car:
                </p>

                <!-- Car Summary (Highlighted) -->
                <div>
                  <p style="font-weight: bold; margin-bottom: 8px">
                    Car information:
                  </p>
                </div>

                <!-- Key Details -->
                <table
                  width="100%"
                  cellpadding="8"
                  cellspacing="0"
                  style="border-collapse: collapse; margin-bottom: 20px"
                >
                  <tr>
                    <td style="font-weight: bold; width: 150px">Brand:</td>
                    <td>{{brand}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight: bold; width: 150px">Model:</td>
                    <td>{{model}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight: bold; width: 150px">Year:</td>
                    <td>{{year}}</td>
                  </tr>
                  <tr>
                    <td style="font-weight: bold; width: 150px">
                      Expected Price:
                    </td>
                    <td>{{price}}</td>
                  </tr>
                </table>

                <!-- Seller Info -->
                <div style="margin-top: 10px">
                  <p style="font-weight: bold; margin-bottom: 8px">
                    Seller Contact:
                  </p>

                  <table width="100%" cellpadding="6" cellspacing="0">
                    <tr>
                      <td style="font-weight: bold; width: 120px">Name:</td>
                      <td>{{name}}</td>
                    </tr>
                    <tr>
                      <td style="font-weight: bold">Email:</td>
                      <td>{{email}}</td>
                    </tr>
                    <tr>
                      <td style="font-weight: bold">Phone:</td>
                      <td>{{phone}}</td>
                    </tr>
                  </table>
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 15px;
                  text-align: center;
                  font-size: 12px;
                  color: #888;
                "
              >
                This request was submitted from your car selling form.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
